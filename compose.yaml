name: ${COMPOSE_PROJECT_NAME:-hefesto-formularios}
services:
  postgres:
    restart: always
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    volumes:
    - postgres:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: formbricks
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres || exit 1
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  authzed-db-bootstrap:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    restart: 'no'
    entrypoint:
    - /bin/sh
    - /usr/local/bin/authzed-postgres-bootstrap.sh
    environment:
      POSTGRES_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD
        in .env}}@postgres:5432/postgres?sslmode=disable
      AUTHZED_DATABASE_NAME: spicedb
      AUTHZED_DATABASE_USERNAME: spicedb
      AUTHZED_DATABASE_PASSWORD: ${AUTHZED_DATABASE_PASSWORD:?AUTHZED_DATABASE_PASSWORD is required}
    volumes:
    - ./authzed-postgres-bootstrap.sh:/usr/local/bin/authzed-postgres-bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
  spicedb-migrate:
    image: authzed/spicedb:v1.52.0@sha256:1d205e9e98e39d87f9640893a06787c854a77d1ffcc3f7ece5e3293896565aa9
    restart: 'no'
    command: datastore migrate head
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgresql://spicedb:${AUTHZED_DATABASE_PASSWORD:?AUTHZED_DATABASE_PASSWORD is required}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      authzed-db-bootstrap:
        condition: service_completed_successfully
  spicedb:
    image: authzed/spicedb:v1.52.0@sha256:1d205e9e98e39d87f9640893a06787c854a77d1ffcc3f7ece5e3293896565aa9
    restart: always
    command: serve
    mem_limit: 512m
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgresql://spicedb:${AUTHZED_DATABASE_PASSWORD:?AUTHZED_DATABASE_PASSWORD is required}@postgres:5432/spicedb?sslmode=disable
      SPICEDB_GRPC_PRESHARED_KEY: ${AUTHZED_TOKEN:?AUTHZED_TOKEN is required}
      SPICEDB_LOG_FORMAT: json
      SPICEDB_LOG_LEVEL: info
      SPICEDB_TELEMETRY_ENDPOINT: ''
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/grpc_health_probe
      - -addr=localhost:50051
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  redis:
    restart: always
    image: valkey/valkey@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84
    command: valkey-server --appendonly yes --maxmemory-policy noeviction
    volumes:
    - redis:/data
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  formbricks-migrate:
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@postgres:5432/formbricks?schema=public
      WEBAPP_URL: ${WEBAPP_URL:?Configurar WEBAPP_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Configurar NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Configurar NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Configurar ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET:?Configurar CRON_SECRET}
      REDIS_URL: redis://redis:6379
      HUB_API_KEY: ${HUB_API_KEY:-}
      TAXONOMY_SERVICE_URL: ''
      TAXONOMY_SERVICE_TOKEN: ''
      HUB_INTERNAL_API_TOKEN: ''
      TAXONOMY_LLM_PROVIDER: ''
      TAXONOMY_LLM_MODEL: ''
      TAXONOMY_LLM_BASE_URL: ''
      TAXONOMY_LLM_API_KEY: ''
      TAXONOMY_VERTEX_PROJECT: ''
      TAXONOMY_VERTEX_LOCATION: ''
      TAXONOMY_GOOGLE_CLOUD_CREDENTIALS_JSON: ''
      TAXONOMY_BEDROCK_MODEL: ''
      TAXONOMY_MAX_RECORDS: ''
      AWS_BEARER_TOKEN_BEDROCK: ''
      HUB_API_URL: ${HUB_API_URL:-http://hub:8080}
      CUBEJS_API_URL: ${CUBEJS_API_URL:-http://cube:4000}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-}
      CUBEJS_JWT_ISSUER: ${CUBEJS_JWT_ISSUER:-formbricks-web}
      CUBEJS_JWT_AUDIENCE: ${CUBEJS_JWT_AUDIENCE:-formbricks-cube}
      EMAIL_VERIFICATION_DISABLED: '0'
      PASSWORD_RESET_DISABLED: '0'
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: Hefesto Formularios
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE_ENABLED: '1'
      SMTP_AUTHENTICATED: '1'
      SMTP_REJECT_UNAUTHORIZED_TLS: '1'
      TELEMETRY_DISABLED: '1'
      INVITE_DISABLED: '0'
      LOG_LEVEL: info
    image: ghcr.io/formbricks/formbricks:6.0.2@sha256:4c0134b1c9c919d6d63986d5ba2e3ff4a50cf02a05b3173922c75c17539ef4cf
    restart: 'no'
    entrypoint:
    - sh
    - -c
    command:
    - node /home/nextjs/validate-env.mjs && if command -v timeout >/dev/null 2>&1; then timeout 300 node packages/database/dist/scripts/apply-migrations.js;
      else node packages/database/dist/scripts/apply-migrations.js; fi
    depends_on:
      postgres:
        condition: service_healthy
  formbricks:
    restart: always
    image: ghcr.io/formbricks/formbricks:6.0.2@sha256:4c0134b1c9c919d6d63986d5ba2e3ff4a50cf02a05b3173922c75c17539ef4cf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cube:
        condition: service_healthy
      authzed-initialize:
        condition: service_completed_successfully
      permissions:
        condition: service_completed_successfully
    volumes:
    - uploads:/home/nextjs/apps/web/uploads
    - saml:/home/nextjs/apps/web/saml-connection
    - ./ops:/opt/hefesto:ro
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@postgres:5432/formbricks?schema=public
      WEBAPP_URL: ${WEBAPP_URL:?Configurar WEBAPP_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Configurar NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Configurar NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Configurar ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET:?Configurar CRON_SECRET}
      REDIS_URL: redis://redis:6379
      HUB_API_KEY: ${HUB_API_KEY:-}
      TAXONOMY_SERVICE_URL: ''
      TAXONOMY_SERVICE_TOKEN: ''
      HUB_INTERNAL_API_TOKEN: ''
      TAXONOMY_LLM_PROVIDER: ''
      TAXONOMY_LLM_MODEL: ''
      TAXONOMY_LLM_BASE_URL: ''
      TAXONOMY_LLM_API_KEY: ''
      TAXONOMY_VERTEX_PROJECT: ''
      TAXONOMY_VERTEX_LOCATION: ''
      TAXONOMY_GOOGLE_CLOUD_CREDENTIALS_JSON: ''
      TAXONOMY_BEDROCK_MODEL: ''
      TAXONOMY_MAX_RECORDS: ''
      AWS_BEARER_TOKEN_BEDROCK: ''
      HUB_API_URL: ${HUB_API_URL:-http://hub:8080}
      CUBEJS_API_URL: ${CUBEJS_API_URL:-http://cube:4000}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-}
      CUBEJS_JWT_ISSUER: ${CUBEJS_JWT_ISSUER:-formbricks-web}
      CUBEJS_JWT_AUDIENCE: ${CUBEJS_JWT_AUDIENCE:-formbricks-cube}
      EMAIL_VERIFICATION_DISABLED: '0'
      PASSWORD_RESET_DISABLED: '0'
      SKIP_STARTUP_MIGRATION: 'true'
      AUTHZED_ENABLED: 'true'
      AUTHZED_ENDPOINT: spicedb:50051
      AUTHZED_TOKEN: ${AUTHZED_TOKEN:?AUTHZED_TOKEN is required}
      AUTHZED_SYSTEM_KEY: formbricks
      AUTHZED_INSECURE: 'true'
      AUTHZED_CONSISTENCY: fully_consistent
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: Hefesto Formularios
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE_ENABLED: '1'
      SMTP_AUTHENTICATED: '1'
      SMTP_REJECT_UNAUTHORIZED_TLS: '1'
      TELEMETRY_DISABLED: '1'
      INVITE_DISABLED: '0'
      LOG_LEVEL: info
      BOOTSTRAP_MODE: 'false'
      OPERATOR_ACCOUNT_CREATED: ${OPERATOR_ACCOUNT_CREATED:-false}
      SMTP_READY: ${SMTP_READY:-false}
    entrypoint:
    - sh
    - -ec
    - node /opt/hefesto/check-env.cjs && exec /home/nextjs/start.sh
    expose:
    - '3000'
  authzed-ops:
    profiles:
    - authzed-ops
    image: ghcr.io/formbricks/formbricks:6.0.2@sha256:4c0134b1c9c919d6d63986d5ba2e3ff4a50cf02a05b3173922c75c17539ef4cf
    entrypoint:
    - formbricks-authzed
    command:
    - health
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@postgres:5432/formbricks?schema=public
      ENCRYPTION_KEY: authzed-ops-unused
      CUBEJS_API_SECRET: authzed-ops-unused
      CUBEJS_API_URL: http://localhost
      HUB_API_KEY: authzed-ops-unused
      HUB_API_URL: http://localhost
      REDIS_URL: redis://localhost
      LOG_LEVEL: fatal
      AUTHZED_ENABLED: 'true'
      AUTHZED_ENDPOINT: spicedb:50051
      AUTHZED_TOKEN: ${AUTHZED_TOKEN:?AUTHZED_TOKEN is required}
      AUTHZED_SYSTEM_KEY: formbricks
      AUTHZED_INSECURE: 'true'
      AUTHZED_CONSISTENCY: fully_consistent
    depends_on:
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_healthy
  authzed-initialize:
    image: ghcr.io/formbricks/formbricks:6.0.2@sha256:4c0134b1c9c919d6d63986d5ba2e3ff4a50cf02a05b3173922c75c17539ef4cf
    restart: 'no'
    entrypoint:
    - formbricks-authzed
    command:
    - upgrade
    - prepare
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@postgres:5432/formbricks?schema=public
      ENCRYPTION_KEY: authzed-initialize-unused
      CUBEJS_API_SECRET: authzed-initialize-unused
      CUBEJS_API_URL: http://localhost
      HUB_API_KEY: authzed-initialize-unused
      HUB_API_URL: http://localhost
      REDIS_URL: redis://localhost
      LOG_LEVEL: fatal
      AUTHZED_ENABLED: 'true'
      AUTHZED_ENDPOINT: spicedb:50051
      AUTHZED_TOKEN: ${AUTHZED_TOKEN:?AUTHZED_TOKEN is required}
      AUTHZED_SYSTEM_KEY: formbricks
      AUTHZED_INSECURE: 'true'
      AUTHZED_CONSISTENCY: fully_consistent
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully
      spicedb:
        condition: service_healthy
  hub-migrate:
    image: ghcr.io/formbricks/hub@sha256:967089f22585f3c3730e455b8b20885b0739f26b5ce5e034324658aa51d627f2
    restart: 'no'
    entrypoint:
    - sh
    - -c
    command:
    - if [ -x /usr/local/bin/goose ] && [ -x /usr/local/bin/river ]; then /usr/local/bin/goose -dir /app/migrations postgres
      "$$DATABASE_URL" up && /usr/local/bin/river migrate-up --database-url "$$DATABASE_URL"; else echo 'Migration tools (goose/river)
      not in image.'; exit 1; fi
    environment:
      DATABASE_URL: ${HUB_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD
        in .env}}@postgres:5432/formbricks?sslmode=disable}
    depends_on:
      formbricks-migrate:
        condition: service_completed_successfully
  hub:
    restart: always
    image: ghcr.io/formbricks/hub@sha256:967089f22585f3c3730e455b8b20885b0739f26b5ce5e034324658aa51d627f2
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      API_KEY: ${HUB_API_KEY:-}
      DATABASE_URL: ${HUB_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD
        in .env}}@postgres:5432/formbricks?sslmode=disable}
      TAXONOMY_SERVICE_URL: ''
      TAXONOMY_SERVICE_TOKEN: ''
      HUB_INTERNAL_API_TOKEN: ''
  cube:
    restart: always
    image: ghcr.io/formbricks/cube:1.7.47-1@sha256:3859ec17f4e81fe5147cde8b6b81bccbed329023b803e4a315f0988e5c9372b8
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: ${CUBEJS_DB_HOST:-postgres}
      CUBEJS_DB_NAME: ${CUBEJS_DB_NAME:-formbricks}
      CUBEJS_DB_USER: ${CUBEJS_DB_USER:-postgres}
      CUBEJS_DB_PASS: ${CUBEJS_DB_PASS:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      CUBEJS_DB_PORT: ${CUBEJS_DB_PORT:-5432}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-}
      CUBEJS_JWT_ISSUER: ${CUBEJS_JWT_ISSUER:-formbricks-web}
      CUBEJS_JWT_AUDIENCE: ${CUBEJS_JWT_AUDIENCE:-formbricks-cube}
      CUBEJS_DEFAULT_API_SCOPES: meta,data
      CUBEJS_EXTERNAL_DEFAULT: ${CUBEJS_EXTERNAL_DEFAULT:-false}
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    volumes:
    - ./cube/cube.js:/cube/conf/cube.js:ro
    - ./cube/schema:/cube/conf/model:ro
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://127.0.0.1:4000/readyz'', (res) => { res.resume(); process.exit(res.statusCode ===
        200 ? 0 : 1); }).on(''error'', () => process.exit(1));'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  hub-worker:
    image: ghcr.io/formbricks/hub@sha256:967089f22585f3c3730e455b8b20885b0739f26b5ce5e034324658aa51d627f2
    restart: unless-stopped
    entrypoint:
    - /app/hub-worker
    environment:
      DATABASE_URL: ${HUB_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD_URL_ENCODED:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD
        in .env}}@postgres:5432/formbricks?sslmode=disable}
      TAXONOMY_SERVICE_URL: ''
      TAXONOMY_SERVICE_TOKEN: ''
      HUB_INTERNAL_API_TOKEN: ''
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
  permissions:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    restart: 'no'
    user: '0'
    entrypoint:
    - sh
    - -ec
    - chown -R 1001:1001 /uploads /saml; chmod 700 /uploads /saml
    volumes:
    - uploads:/uploads
    - saml:/saml
  backup-tools:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    profiles:
    - tools
    user: '0'
    volumes:
    - postgres:/volumes/postgres
    - redis:/volumes/redis
    - uploads:/volumes/uploads
    - saml:/volumes/saml
volumes:
  postgres: {}
  redis: {}
  uploads: {}
  saml: {}
